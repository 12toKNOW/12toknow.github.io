<title>Cowin Equipment — Model Reference & Spec Cards</title>
<style>
:root{--cowin-green:#135339;--cowin-green-dark:#0d3e2a;--accent:#c8a96a;--bg:#f5f5f0;--card:#fff;--ink:#1a1a1a;--ink-soft:#555;--ink-faint:#888;--border:#e0ddd4;}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
.header{background:var(--cowin-green);color:#fff;padding:1.1rem 1.5rem;border-bottom:4px solid var(--accent);position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.header-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.brand-mark{font-size:1.35rem;font-weight:800;letter-spacing:-.02em}
.brand-mark span{font-weight:300;opacity:.85;margin-left:.5rem}
.header-meta{font-size:.75rem;opacity:.9;text-align:right;line-height:1.4}
.controls{max-width:1400px;margin:0 auto;padding:1.5rem 1.5rem .5rem}
.search-wrap{position:relative;margin-bottom:1rem}
.search{width:100%;padding:.85rem 1rem .85rem 2.75rem;font-size:1rem;border:2px solid var(--border);border-radius:6px;background:#fff;font-family:inherit}
.search:focus{outline:none;border-color:var(--cowin-green)}
.search-icon{position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--ink-faint)}
.filter-label{font-size:.7rem;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.1em;margin-bottom:.4rem}
.filter-bar{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.9rem}
.filter-btn{padding:.5rem .9rem;border:2px solid var(--border);background:#fff;border-radius:6px;font-family:inherit;font-size:.8rem;font-weight:600;color:var(--ink-soft);cursor:pointer;transition:all .15s}
.filter-btn:hover{border-color:var(--cowin-green)}
.filter-btn.active{background:var(--cowin-green);color:#fff;border-color:var(--cowin-green)}
.toggle-row{display:flex;align-items:center;gap:.6rem;margin-bottom:.5rem;font-size:.85rem;color:var(--ink-soft)}
.toggle{appearance:none;width:38px;height:22px;background:var(--border);border-radius:22px;position:relative;cursor:pointer;transition:.15s}
.toggle:checked{background:var(--cowin-green)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.15s}
.toggle:checked::after{left:18px}
.stats-bar{font-size:.82rem;color:var(--ink-soft);padding:.4rem 0}
.stats-bar strong{color:var(--cowin-green)}
.grid-wrap{max-width:1400px;margin:0 auto;padding:.5rem 1.5rem 3rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:1rem 1.1rem;cursor:pointer;transition:all .18s;display:flex;flex-direction:column;position:relative;border-top:3px solid var(--oem,#ccc)}
.card:hover{box-shadow:0 6px 20px rgba(0,0,0,.10);transform:translateY(-2px)}
.card.idx{cursor:default;opacity:.92}
.card.idx:hover{transform:none;box-shadow:none}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem}
.card-model{font-size:1.2rem;font-weight:800;letter-spacing:-.015em}
.card-oem{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--oem);white-space:nowrap}
.card-cat{font-size:.72rem;color:var(--ink-faint);margin:.15rem 0 .5rem;text-transform:uppercase;letter-spacing:.04em}
.card-class{display:inline-block;font-size:.68rem;font-weight:700;color:var(--oem);background:color-mix(in srgb,var(--oem) 10%,transparent);padding:.15rem .5rem;border-radius:3px;margin-bottom:.5rem}
.card-comps{font-size:.72rem;color:var(--ink-faint);margin-bottom:.5rem;padding:.35rem .5rem;background:#faf9f5;border-radius:4px;border-left:2px solid var(--accent)}
.card-comps strong{color:var(--oem)}
.card-specs{display:grid;grid-template-columns:1fr 1fr;gap:.4rem .7rem;font-size:.78rem;border-top:1px solid var(--border);padding-top:.6rem;margin-top:auto}
.spec-label{color:var(--ink-faint);font-size:.62rem;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.spec-value{color:var(--ink);font-weight:600}
.badge-idx{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);background:#efeee8;padding:.2rem .45rem;border-radius:3px}
.badge-spec{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#fff;background:var(--oem);padding:.2rem .45rem;border-radius:3px}
.idx-note{font-size:.72rem;color:var(--ink-faint);margin-top:.5rem;font-style:italic}
.size-chip{display:inline-block;font-size:.64rem;font-weight:700;letter-spacing:.03em;color:var(--cowin-green);background:rgba(19,83,57,.08);padding:.18rem .45rem;border-radius:3px;margin-top:.5rem}
.flag{display:inline-block;font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#fff;background:var(--warn);padding:.18rem .45rem;border-radius:3px;margin-left:.35rem;cursor:help}
.flag.unlisted{background:#8a6d3b}
.flag.uncoded{background:#a83232}
.audit-note{font-size:.75rem;background:#fff8ef;border:1px solid #f0dcc0;border-left:3px solid var(--warn);border-radius:5px;padding:.6rem .75rem;margin-top:1rem;color:#7a5a1f}
.audit-note strong{color:#8a4b00}
.select{padding:.5rem .7rem;border:2px solid var(--border);border-radius:6px;font-family:inherit;font-size:.82rem;font-weight:600;color:var(--ink-soft);background:#fff;min-width:200px}
.select:focus{outline:none;border-color:var(--cowin-green)}
.toggle.warn:checked{background:var(--warn)}
.bucket-line{font-size:.7rem;color:var(--ink-soft);margin-top:.5rem;padding:.35rem .5rem;background:rgba(19,83,57,.05);border-radius:4px;border-left:2px solid var(--cowin-green)}
.bucket-line b{color:var(--cowin-green)}
.bucket-table{width:100%;border-collapse:collapse;font-size:.82rem;margin-top:.3rem}
.bucket-table th,.bucket-table td{padding:.45rem .6rem;text-align:left;border-bottom:1px solid var(--border)}
.bucket-table th{font-size:.64rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);font-weight:700}
.bucket-table td.rents{font-weight:800;color:var(--cowin-green)}
.bucket-legend{font-size:.7rem;color:var(--ink-faint);margin-top:.5rem;line-height:1.5}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;padding:2rem 1rem;z-index:200;overflow-y:auto}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:10px;max-width:820px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-head{background:var(--oem);color:#fff;padding:1.2rem 1.5rem;border-radius:10px 10px 0 0;position:relative}
.modal-head h2{font-size:1.6rem;font-weight:800}
.modal-head .sub{font-size:.85rem;opacity:.92;margin-top:.2rem}
.modal-close{position:absolute;top:1rem;right:1.2rem;background:rgba(255,255,255,.2);border:none;color:#fff;width:32px;height:32px;border-radius:50%;font-size:1.2rem;cursor:pointer}
.modal-body{padding:1.5rem}
.modal-desc{font-size:.9rem;color:var(--ink-soft);margin-bottom:1.2rem}
.sec-title{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--cowin-green);margin:1.2rem 0 .6rem;border-bottom:2px solid var(--border);padding-bottom:.3rem}
.spec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.7rem 1.2rem}
.spec-grid .k{font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);font-weight:600}
.spec-grid .v{font-size:.9rem;font-weight:600}
.comp-table{width:100%;border-collapse:collapse;font-size:.8rem;margin-top:.3rem}
.comp-table th,.comp-table td{padding:.5rem .6rem;text-align:left;border-bottom:1px solid var(--border)}
.comp-table th{font-size:.66rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);font-weight:700}
.comp-table td.own{font-weight:700;color:var(--oem);background:color-mix(in srgb,var(--oem) 6%,transparent)}
.comp-table th.own{color:var(--oem)}
.comp-names{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:.3rem}
.comp-chip{font-size:.72rem;background:#faf9f5;border:1px solid var(--border);border-radius:4px;padding:.3rem .6rem}
.comp-chip b{color:var(--ink-soft)}
.disclaimer{font-size:.72rem;color:var(--ink-faint);margin-top:1.4rem;padding-top:.8rem;border-top:1px solid var(--border);line-height:1.5}
.empty{text-align:center;padding:3rem;color:var(--ink-faint)}
@media(max-width:600px){.card-specs{grid-template-columns:1fr}}
</style></head>

  const ob=el('oemBar');ob.innerHTML='';
  ['All',...DATA.oems.map(o=>o.name)].forEach(o=>{
    const b=document.createElement('button');b.className='filter-btn'+(fOem===o?' active':'');b.textContent=o;
    if(o!=='All'&&fOem===o)b.style.background=oemColor[o],b.style.borderColor=oemColor[o];
    b.onclick=()=>{fOem=o;fCat='All';render();};ob.appendChild(b);});
  const cb=el('catBar');cb.innerHTML='';
  cats().forEach(c=>{const b=document.createElement('button');b.className='filter-btn'+(fCat===c?' active':'');b.textContent=c;
    b.onclick=()=>{fCat=c;render();};cb.appendChild(b);});
}
function bucketDecode(cfg){
  const parts=String(cfg).split('-'); const width=parts[0]; let cap=null,type;
  if(parts.length>1 && /^d*.?d+$/.test(parts[1])){ cap=parts[1]; type=parts.slice(2).join('-'); }
  else { type=parts.slice(1).join('-'); }
  return {width:width, cap:cap, type:type};
}
function bucketLabel(cfg){ const d=bucketDecode(cfg); return d.width+'″'+(d.cap?' · '+d.cap+' yd³':'')+(d.type?' · '+d.type:''); }
function normModel(s){ return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }
function match(m){
  if(fOem!=='All'&&m.oem!==fOem)return false;
  if(fCat!=='All'&&m.category!==fCat)return false;
  if(fSize!=='All'&&(m.sizeGroup||'—')!==fSize)return false;
  if(fSpec&&!m.hasCard)return false;
  if(fFlag&&!m.flag)return false;
  if(q){const comp=m.competitors?Object.values(m.competitors).join(' '):'';
    const s=(m.name+' '+m.oem+' '+m.category+' '+(m.description||'')+' '+(m.search||'')+' '+(m.sizeGroup||'')+' '+comp).toLowerCase();
    if(!s.includes(q))return false;}
  return true;
}
function sizeOptions(){
  const set=new Set();
  DATA.models.forEach(m=>{if((fOem==='All'||m.oem===fOem)&&(fCat==='All'||m.category===fCat)&&m.sizeGroup)set.add(m.sizeGroup);});
  return [...set].sort((a,b)=>{const na=parseInt(a),nb=parseInt(b);return (isNaN(na)||isNaN(nb))?a.localeCompare(b):na-nb;});
}
function card(m){
  const d=document.createElement('div');
  d.className='card'+(m.hasCard?'':' idx');d.style.setProperty('--oem',oemColor[m.oem]||'#999');
  const comps=m.competitors?Object.entries(m.competitors).filter(([k,v])=>v&&v!=='—').map(([k,v])=>cap(k)+' '+v).join(' · '):'';
  let flagHtml='';
  if(m.flag){const cl=m.auditStatus==='UNLISTED'?'unlisted':m.auditStatus==='UNCODED'?'uncoded':'';
    const tip=m.auditStatus==='UNLISTED'?'Current model not found in ERP Model Master — add it':
      m.auditStatus==='UNCODED'?('In a catch-all rental bin'+(m.suggested?' → should be: '+m.suggested:'')):
      ('Assigned: '+(m.assignedRent||'?')+(m.suggested?' → should be: '+m.suggested:''));
    flagHtml=' <span class="flag '+cl+'" title="'+tip.replace(/"/g,'')+'">⚠ '+m.flag+'</span>';}
  let inner='<div class="card-top"><div class="card-model">'+m.name+'</div><div>'+(m.hasCard?'<span class="badge-spec">Specs</span>':'<span class="badge-idx">Index</span>')+'</div></div>';
  inner+='<div class="card-oem">'+m.oem+'</div>';
  inner+='<div class="card-cat">'+m.category+'</div>';
  if(m.sizeGroup)inner+='<div><span class="size-chip">'+cleanSize(m.sizeGroup)+'</span>'+flagHtml+'</div>';
  else if(flagHtml)inner+='<div style="margin-top:.5rem">'+flagHtml+'</div>';
  if(m.hasCard){
    if(m.weightClass)inner+='<div class="card-class">'+m.weightClass+'</div>';
    if(comps)inner+='<div class="card-comps"><strong>vs</strong> '+comps+'</div>';
    let s3,s4;
    if(m.specs.payload){s3=['Payload',m.specs.payload];s4=['Dump',m.specs.dumpType];}
    else if(m.specs.freeAir){s3=['Free Air',m.specs.freeAir];s4=['Pressure',m.specs.ratedPressure];}
    else if(m.specs.ratedOperatingCapacity){s3=['Rated Op. Cap.',m.specs.ratedOperatingCapacity];s4=['Lift Type',m.specs.liftType];}
    else if(m.specs.maxDigDepth){s3=['Dig Depth',m.specs.maxDigDepth];s4=m.specs.maxDigReach?['Max Reach',m.specs.maxDigReach]:['Bucket',m.specs.bucketCapacity];}
    else if(m.specs.bucketCapacity && m.specs.bucketCapacity!=='n/a'){s3=['Bucket',m.specs.bucketCapacity];s4=['Emissions',m.specs.emissions];}
    else {s3=['Drum Width',m.specs.drumWidth];s4=['Emissions',m.specs.emissions];}
    inner+='<div class="card-specs">'
      +sp('Op. Weight',m.specs.operatingWeight)+sp('Power',m.specs.grossPower)
      +sp(s3[0],s3[1])+sp(s4[0],s4[1])+'</div>';
    if(m.buckets&&m.buckets.items&&m.buckets.items.length){
      const b=m.buckets.items[0];
      inner+='<div class="bucket-line">&#129704; Top rented bucket: <b>'+bucketLabel(b[0])+'</b> <span style="color:var(--ink-faint)">('+b[1]+' rentals)</span></div>';
    }
    d.onclick=()=>openModal(m);
  }else{
    inner+='<div class="idx-note">In ERP system · full specs coming</div>';
  }
  d.innerHTML=inner;return d;
}
function sp(l,v){return v?'<div><div class="spec-label">'+l+'</div><div class="spec-value">'+v+'</div></div>':'';}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function renderSizeSel(){
  const sel=el('sizeSel');const opts=sizeOptions();
  const cur=fSize;
  sel.innerHTML='<option value="All">All sizes</option>'+opts.map(o=>'<option value="'+o.replace(/"/g,'&quot;')+'"'+(o===cur?' selected':'')+'>'+cleanSize(o)+'</option>').join('');
  if(cur!=='All'&&!opts.includes(cur)){fSize='All';sel.value='All';}
}
function render(){
  renderChips();
  renderSizeSel();
  const list=DATA.models.filter(match);
  const g=el('grid');g.innerHTML='';
  list.sort((a,b)=>(b.hasCard-a.hasCard)||a.oem.localeCompare(b.oem)||a.name.localeCompare(b.name,undefined,{numeric:true}));
  list.forEach(m=>g.appendChild(card(m)));
  el('empty').style.display=list.length?'none':'block';
  const spec=list.filter(m=>m.hasCard).length;
  const flagged=list.filter(m=>m.flag).length;
  el('stats').innerHTML='Showing <strong>'+list.length+'</strong> models · <strong>'+spec+'</strong> with full spec cards · <strong>'+(list.length-spec)+'</strong> index-only'
    +(flagged?' · <strong style="color:var(--warn)">⚠ '+flagged+'</strong> flagged for ERP re-code':'');
}
function openModal(m){
  const c=oemColor[m.oem];const ov=el('overlay'),md=el('modal');
  md.style.setProperty('--oem',c);
  let h='<div class="modal-head" style="background:'+c+'"><button class="modal-close" onclick="closeModal()">&times;</button>'
    +'<h2>'+m.name+'</h2><div class="sub">'+m.oem+' · '+m.category+(m.weightClass?' · '+m.weightClass:'')+(m.generation?' · '+m.generation:'')+'</div></div>';
  h+='<div class="modal-body">';
  if(m.description)h+='<div class="modal-desc">'+m.description+'</div>';
  if(m.sizeGroup||m.flag){
    h+='<div class="sec-title">Rental Size Group</div>';
    h+='<div style="font-size:.9rem;font-weight:600">'+(m.sizeGroup?cleanSize(m.sizeGroup):'—')+(m.assignedRent?' <span style="font-weight:400;color:var(--ink-faint)">('+m.assignedRent+')</span>':'')+'</div>';
    if(m.flag){
      let msg;
      if(m.auditStatus==='UNLISTED')msg='<strong>Not in ERP Model Master.</strong> This current model has no matching entry — add it and assign a rental size class.';
      else if(m.auditStatus==='UNCODED')msg='<strong>Uncoded.</strong> Sits in a catch-all rental bin'+(m.suggested?' — spec-derived size suggests <strong>'+m.suggested+'</strong>.':'.');
      else msg='<strong>Mis-sized.</strong> Assigned <strong>'+(m.assignedRent||'?')+'</strong>, but this unit\'s spec puts it in <strong>'+(m.suggested||'a different bracket')+'</strong>.';
      h+='<div class="audit-note">⚠ '+msg+' <em>Flagged for ERP review.</em></div>';
    }
  }
  h+='<div class="sec-title">Specifications</div><div class="spec-grid">';
  const order=[['payload','Payload / Capacity'],['dumpType','Dump Type'],['groundPressure','Ground Pressure (loaded)'],['freeAir','Free-Air Delivery'],['ratedPressure','Rated Pressure'],['pressureRange','Pressure Range'],['fuelTank','Fuel Tank'],['operatingWeight','Operating Weight'],['grossPower','Power'],['engine','Engine'],['ratedOperatingCapacity','Rated Op. Capacity (35%)'],['tipLoad','Tip Load'],['liftType','Lift Type'],['hingePinHeight','Hinge Pin Height'],['auxFlow','Aux Hydraulic Flow'],['drumWidth','Drum Width'],['drumType','Drum Type'],['bucketCapacity','Bucket Capacity'],['maxDigDepth','Max Dig Depth'],['maxDigReach','Max Reach'],['hydraulicSystem','Hydraulics'],['emissions','Emissions'],['typical','Typical Use']];
  order.forEach(([k,l])=>{if(m.specs&&m.specs[k]&&m.specs[k]!=='n/a')h+='<div><div class="k">'+l+'</div><div class="v">'+m.specs[k]+'</div></div>';});
  h+='</div>';
  if(m.competitors){
    const brands=Object.keys(m.competitors).filter(b=>m.competitors[b]&&m.competitors[b]!=='—');
    h+='<div class="sec-title">Competing Models</div><div class="comp-names">';
    brands.forEach(b=>h+='<div class="comp-chip"><b>'+cap(b)+':</b> '+m.competitors[b]+'</div>');
    h+='</div>';
  }
  if(m.compTable&&m.compTable.length){
    const ownMap={'Takeuchi':'takeuchi','Hitachi':'hitachi','Volvo CE':'volvo','Kobelco':'kobelco','Bomag':'bomag','Doosan/Bobcat Portable':'air','Terramac':'terramac'};
    const ownKey=ownMap[m.oem]||Object.keys(m.compTable[0]).find(k=>k!=='label');
    const brandKeys=Object.keys(m.compTable[0]).filter(k=>k!=='label');
    h+='<div class="sec-title">Spec Comparison</div><div style="overflow-x:auto"><table class="comp-table"><thead><tr><th></th>';
    brandKeys.forEach(k=>h+='<th class="'+(k===ownKey?'own':'')+'">'+(k===ownKey?m.oem:cap(k))+'</th>');
    h+='</tr></thead><tbody>';
    m.compTable.forEach(r=>{h+='<tr><th>'+r.label+'</th>';brandKeys.forEach(k=>h+='<td class="'+(k===ownKey?'own':'')+'">'+(r[k]||'—')+'</td>');h+='</tr>';});
    h+='</tbody></table></div>';
  }
  if(m.buckets&&m.buckets.items&&m.buckets.items.length){
    h+='<div class="sec-title">Top Rented Buckets — 3-yr billings</div>';
    if(m.buckets.class && !normModel(m.name).startsWith(normModel(m.buckets.class)))
      h+='<div style="font-size:.72rem;color:var(--ink-faint);margin-bottom:.3rem">Billing fleet class: <strong>'+m.buckets.class+'</strong></div>';
    h+='<div style="overflow-x:auto"><table class="bucket-table"><thead><tr><th>Width</th><th>Capacity</th><th>Type</th><th>Rentals (3 yr)</th></tr></thead><tbody>';
    m.buckets.items.forEach(it=>{const bd=bucketDecode(it[0]);h+='<tr><td>'+bd.width+'″</td><td>'+(bd.cap?bd.cap+' yd³':'—')+'</td><td>'+(bd.type||'—')+'</td><td class="rents">'+it[1]+'</td></tr>';});
    h+='</tbody></table></div>';
    h+='<div class="bucket-legend"><strong>Types:</strong> HD = heavy-duty dig · GP = general-purpose · SM = smooth (ditching) · MP = multi-purpose · DC = ditch-cleaning · HYD = hydraulic tilt · HC = high-capacity · SD/SE = severe-duty. Ranked by distinct rental contracts, 2023–2025 billings.</div>';
  }
  h+='<div class="disclaimer">Spec figures are approximate and drawn from manufacturer literature for quick reference — always confirm exact specs on the current OEM spec sheet before quoting. Competitor models are class equivalents, not exact matches. &quot;~&quot; denotes an approximate value.</div>';
  h+='</div>';
  md.innerHTML=h;ov.classList.add('open');
}
function closeModal(){el('overlay').classList.remove('open');}
el('overlay').onclick=e=>{if(e.target===el('overlay'))closeModal();};
el('search').oninput=e=>{q=e.target.value.trim().toLowerCase();render();};
el('sizeSel').onchange=e=>{fSize=e.target.value;render();};
el('specOnly').onchange=e=>{fSpec=e.target.checked;render();};
el('flagOnly').onchange=e=>{fFlag=e.target.checked;render();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
render();
</script></body></html>
