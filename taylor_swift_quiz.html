<style>
  /* ── Reset & Base ── */
  #ts-quiz-root *, #ts-quiz-root *::before, #ts-quiz-root *::after {
    box-sizing: border-box; margin: 0; padding: 0;
  }
  #ts-quiz-root {
    font-family: 'Lato', sans-serif;
    -webkit-font-smoothing: antialiased;
    width: 100%;
  }

  /* ── Animations ── */
  @keyframes tsfadeUp {
    from { opacity: 0; transform: translateY(22px); }
    to   { opacity: 1; transform: translateY(0);    }
  }
  @keyframes tsScaleIn {
    from { opacity: 0; transform: scale(0.93); }
    to   { opacity: 1; transform: scale(1);    }
  }
  @keyframes tsPulse {
    0%,100% { transform: scale(1);    }
    50%      { transform: scale(1.08); }
  }
  @keyframes tsShimmer {
    0%   { background-position: -200% center; }
    100% { background-position:  200% center; }
  }

  .ts-fade-up   { animation: tsfadeUp  0.55s ease forwards; }
  .ts-scale-in  { animation: tsScaleIn 0.5s  ease forwards; }
  .ts-pulse-once{ animation: tsPulse   1.2s  ease 0.4s 2;   }

  .ts-screen {
    min-height: 480px;
    width: 100%;
    padding: 48px 20px 64px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ts-inner { max-width: 600px; width: 100%; }

    height: 3px;
    background: #EDE8DC;
    width: 100%;
    position: relative;
  }
  .ts-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #C8A858, #F0D070);
    transition: width 0.5s ease;
    border-radius: 0 2px 2px 0;

    border: none;

    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 3px;
    transition: background 0.2s ease, letter-spacing 0.2s ease;
    display: inline-block;

  .ts-option {

    background: white;
    border: 1.5px solid #E2DDD6;
    border-radius: 14px;
    padding: 17px 22px;
    cursor: pointer;
    font-family: 'Lato', sans-serif;
    font-size: 15px;
    line-height: 1.55;
    color: #2A2A2A;
    display: block;
    margin-bottom: 10px;

  .ts-option.picked { border-color: #B8A070; background: #FFF9ED; }

  /* ── Divider ornament ── */
  .ts-ornament {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 24px 0;
  }
  .ts-ornament-line {
    flex: 1; height: 1px;
  }

  /* ── Trait chips ── */
  .ts-chip {
    display: inline-block;
    padding: 5px 13px;
    border-radius: 20px;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin: 3px;
  }

  /* ── Card grid ── */
  .ts-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
  .ts-grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 9px; }

    .ts-grid-3 { grid-template-columns: repeat(2,1fr); }
    .ts-grid-2 { grid-template-columns: 1fr; }
  }

    width: 100%;

    padding: 34px 30px;

    font-size: 11px;

    height: 100%;

  .ts-card {
    background: white;
    border-radius: 14px;
    padding: 26px 28px;
    margin-bottom: 22px;
  }
  .ts-card-label {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    opacity: 0.55;
    margin-bottom: 12px;

  /* ── Dot indicators ── */
  .ts-dots { display: flex; gap: 4px; }
  .ts-dot {
    height: 3px;
    border-radius: 2px;
    transition: background 0.3s;
  }

  /* ── Intro persona grid item ── */
  .ts-persona-tile {
    border-radius: 10px;
    padding: 14px 8px;
    text-align: center;
  }
</style>

function calcScores(answers) {
  var t = {};
  PERSONAS.forEach(function(p){ t[p.id] = 0; });
  answers.forEach(function(a){
    if (!a || !a.weight) return;
    Object.keys(a.weight).forEach(function(k){ t[k] = (t[k]||0) + a.weight[k]; });
  });
  return t;
}

function topTwo(scores) {
  var sorted = Object.keys(scores).sort(function(a,b){ return scores[b]-scores[a]; });
  return [sorted[0], sorted[1]];
}

  return PERSONAS.filter(function(p){ return p.id === id; })[0];

// ── RENDER ─────────────────────────────────────────────────────────────────
function render() {
  var root = document.getElementById('ts-quiz-root');
  if (!root) return;
  var html = '';
  if      (state.screen === 'intro')  html = renderIntro();
  else if (state.screen === 'test')   html = renderTest();
  else if (state.screen === 'result') html = renderResult();
  root.innerHTML = html;
  bindEvents();
  if (state.screen === 'result') {
    setTimeout(function(){ animateBars(); }, 100);
  }
}

// ── INTRO ──────────────────────────────────────────────────────────────────
function renderIntro() {
  var tiles = PERSONAS.map(function(p){
    return '<div class="ts-persona-tile" style="background:'+p.bg+';border:1px solid '+p.color+'44;">'
      + '<div style="font-size:26px;margin-bottom:5px;">'+p.emoji+'</div>'
      + '<div style="font-family:\'Playfair Display\',serif;font-size:12px;font-weight:700;color:'+p.accent+';line-height:1.2;">'+p.name+'</div>'
      + '</div>';
  }).join('');

  return '<div class="ts-screen ts-fade-up" style="background:linear-gradient(155deg,#FAF8F2 0%,#F0E8D0 60%,#E8DFC0 100%);">'
    + '<div class="ts-inner" style="text-align:center;">'
    + '<div style="font-family:\'DM Mono\',monospace;font-size:10px;letter-spacing:4px;text-transform:uppercase;color:#B8903A;margin-bottom:20px;">A Lyrical &amp; Fan Interpretation Study</div>'
    + '<h1 style="font-family:\'Playfair Display\',serif;font-size:clamp(38px,8vw,64px);font-weight:900;line-height:1.0;color:#1A1A1A;margin-bottom:4px;">'
    + 'Which<br><em style="color:#B8903A;font-weight:400;">Taylor Swift</em><br>Persona Are You?</h1>'
    + '<div class="ts-ornament"><div class="ts-ornament-line" style="background:linear-gradient(90deg,transparent,#C8A858);"></div>'
    + '<span style="font-size:18px;">✦</span>'
    + '<div class="ts-ornament-line" style="background:linear-gradient(90deg,#C8A858,transparent);"></div></div>'
    + '<p style="font-size:16px;line-height:1.75;color:#555;margin-bottom:10px;">This isn\'t about your favorite era or which song describes you.<br><strong>It\'s about which archetype lives inside you.</strong></p>'
    + '<p style="font-size:14px;line-height:1.7;color:#888;margin-bottom:34px;">Questions go beyond the lyrics — into how fans have decoded the stories, the characters, and found themselves in the gaps Taylor left between the verses.</p>'
    + '<div class="ts-grid-3" style="margin-bottom:38px;">'+tiles+'</div>'
    + '<button class="ts-cta" data-action="start">Begin</button>'
    + '<div style="font-family:\'DM Mono\',monospace;font-size:11px;color:#BBB;margin-top:13px;letter-spacing:1px;">12 questions · ~5 minutes</div>'
    + '</div></div>';
}

// ── TEST ───────────────────────────────────────────────────────────────────
function renderTest() {
  var q = QUESTIONS[state.current];
  var pct = (state.current / QUESTIONS.length * 100).toFixed(1);
  var opacity = state.visible ? '1' : '0';
  var transform = state.visible ? 'translateY(0)' : 'translateY(12px)';

  var dots = QUESTIONS.map(function(_,i){
    var bg = i < state.current ? '#C8A858' : i === state.current ? '#F0D070' : '#E0DAD0';
    var w = i === state.current ? '22px' : '18px';
    return '<div class="ts-dot" style="width:'+w+';background:'+bg+';"></div>';
  }).join('');

  var options = q.options.map(function(opt, i){
    var letter = String.fromCharCode(65+i);
    var picked = state.selected === i ? ' picked' : '';
    return '<button class="ts-option'+picked+'" data-action="answer" data-index="'+i+'">'
      + '<span style="color:#C8A858;font-family:\'DM Mono\',monospace;font-size:11px;margin-right:10px;letter-spacing:1px;">'+letter+'</span>'
      + opt.text + '</button>';
  }).join('');

  return '<div style="min-height:480px;width:100%;display:flex;flex-direction:column;">'
    + '<div class="ts-progress-wrap"><div class="ts-progress-fill" style="width:'+pct+'%;"></div></div>'
    + '<div style="flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;background:#FAF8F2;">'
    + '<div style="max-width:600px;width:100%;opacity:'+opacity+';transform:'+transform+';transition:opacity 0.35s ease,transform 0.35s ease;" id="ts-q-body">'
    + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">'
    + '<span style="font-family:\'DM Mono\',monospace;font-size:10px;letter-spacing:2.5px;color:#C8A858;text-transform:uppercase;">'+(state.current+1)+' / '+QUESTIONS.length+'</span>'
    + '<div class="ts-dots">'+dots+'</div>'
    + '</div>'
    + (q.prompt ? '<div style="font-family:\'DM Mono\',monospace;font-size:10px;letter-spacing:1.5px;color:#AAA;text-transform:uppercase;margin-bottom:5px;">'+q.prompt+'</div>' : '')
    + '<h2 style="font-family:\'Playfair Display\',serif;font-size:clamp(19px,4.5vw,27px);font-weight:700;color:#1A1A1A;line-height:1.35;margin-bottom:28px;">'+q.text+'</h2>'
    + '<div>'+options+'</div>'
    + '</div></div></div>';
}

// ── RESULT ─────────────────────────────────────────────────────────────────
function renderResult() {
  var p = state.primary;
  var sec = state.secondary;
  var scores = state.scores;
  var maxScore = Math.max.apply(null, Object.values(scores));
  var sorted = PERSONAS.slice().sort(function(a,b){ return (scores[b.id]||0)-(scores[a.id]||0); });

  // Share card
  var shareCard = '<div class="ts-share-card ts-scale-in" style="background:'+p.cardBg+';">'
    + '<div class="ts-share-card-noise"></div>'
    + '<div style="position:relative;z-index:1;">'
    + '<div style="font-family:\'DM Mono\',monospace;font-size:10px;letter-spacing:3px;text-transform:uppercase;opacity:0.7;margin-bottom:10px;">My Taylor Swift Archetype</div>'
    + '<div style="font-size:50px;margin-bottom:6px;" class="ts-pulse-once">'+p.emoji+'</div>'
    + '<div style="font-family:\'Playfair Display\',serif;font-size:clamp(26px,6vw,40px);font-weight:900;line-height:1.05;margin-bottom:4px;">'+p.name+'</div>'
    + '<div style="font-family:\'DM Mono\',monospace;font-size:11px;opacity:0.75;letter-spacing:1px;margin-bottom:18px;">'+p.subtitle+'</div>'
    + '<div style="width:40px;height:1px;background:rgba(255,255,255,0.45);margin-bottom:18px;"></div>'
    + '<div style="font-size:14px;line-height:1.65;opacity:0.9;font-family:\'Lato\',sans-serif;margin-bottom:16px;">'+p.fandomMirror+'</div>'
    + '<div style="font-family:\'Playfair Display\',serif;font-style:italic;font-size:13px;opacity:0.8;border-left:2px solid rgba(255,255,255,0.45);padding-left:12px;margin-bottom:16px;">'+p.lyricEcho+'</div>'
    + (sec ? '<div style="background:rgba(255,255,255,0.15);border-radius:10px;padding:12px 15px;font-size:12px;font-family:\'Lato\',sans-serif;opacity:0.9;">'
      + '<span style="font-family:\'DM Mono\',monospace;font-size:9px;letter-spacing:1px;display:block;margin-bottom:4px;opacity:0.7;">TRACES OF</span>'
      + sec.emoji+' '+sec.name+' — '+p.secondaryNote+'</div>' : '')
    + '</div></div>';

  // Traits
  var traits = p.traits.map(function(t){
    return '<span class="ts-chip" style="background:'+p.color+'22;color:'+p.accent+';border:1px solid '+p.color+'55;">'+t+'</span>';
  }).join('');

  // Score bars
  var bars = sorted.map(function(persona){
    var val = scores[persona.id]||0;
    var pct2 = Math.round(val/Math.max(maxScore,1)*100);
    return '<div class="ts-bar-wrap">'
      + '<div class="ts-bar-label"><span>'+persona.emoji+' '+persona.name+'</span><span>'+pct2+'%</span></div>'
      + '<div class="ts-bar-track"><div class="ts-bar-fill" id="bar-'+persona.id+'" data-pct="'+pct2+'" style="width:0%;background:linear-gradient(90deg,'+persona.gradFrom+','+persona.gradTo+');"></div></div>'
      + '</div>';
  }).join('');

  // Other personas
  var others = PERSONAS.filter(function(x){ return x.id !== p.id; }).map(function(x){
    return '<div style="background:'+x.bg+';border:1px solid '+x.color+'44;border-radius:12px;padding:14px 8px;text-align:center;">'
      + '<div style="font-size:26px;margin-bottom:5px;">'+x.emoji+'</div>'
      + '<div style="font-family:\'Playfair Display\',serif;font-size:12px;font-weight:700;color:'+x.accent+';line-height:1.2;">'+x.name+'</div>'
      + '<div style="font-family:\'DM Mono\',monospace;font-size:9px;color:'+x.accent+';opacity:0.6;margin-top:3px;letter-spacing:0.5px;">'+x.subtitle.split('·')[0].trim()+'</div>'
      + '</div>';
  }).join('');

  // Secondary block
  var secBlock = '';
  if (sec) {
    secBlock = '<div style="background:'+sec.bg+';border-radius:14px;padding:24px;border:1.5px dashed '+sec.color+'66;margin-bottom:22px;">'
      + '<div style="font-family:\'DM Mono\',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:'+sec.accent+';opacity:0.7;margin-bottom:10px;">But You Also Have Traces Of</div>'
      + '<div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;">'
      + '<span style="font-size:28px;">'+sec.emoji+'</span>'
      + '<div><div style="font-family:\'Playfair Display\',serif;font-weight:700;color:'+sec.accent+';font-size:16px;">'+sec.name+'</div>'
      + '<div style="font-family:\'DM Mono\',monospace;font-size:10px;color:'+sec.accent+';opacity:0.7;">'+sec.subtitle+'</div></div></div>'
      + '<p style="font-size:14px;line-height:1.6;color:#444;">'+p.secondaryNote+'</p>'
      + '</div>';
  }

  var copyLabel = state.copied ? '✓ Copied!' : 'Copy to Share';

  return '<div style="min-height:100%;background:'+p.bg+';padding:56px 20px 72px;" class="ts-fade-up">'
    + '<div style="max-width:640px;margin:0 auto;">'

    // Header
    + '<div style="text-align:center;margin-bottom:38px;">'
    + '<div style="font-family:\'DM Mono\',monospace;font-size:10px;letter-spacing:4px;text-transform:uppercase;color:'+p.accent+';opacity:0.7;margin-bottom:10px;">Your Archetype</div>'
    + '<div style="font-size:58px;margin-bottom:8px;" class="ts-pulse-once">'+p.emoji+'</div>'
    + '<h1 style="font-family:\'Playfair Display\',serif;font-size:clamp(36px,8vw,56px);font-weight:900;color:'+p.accent+';line-height:1.0;margin-bottom:6px;">'+p.name+'</h1>'
    + '<div style="font-family:\'DM Mono\',monospace;font-size:11px;letter-spacing:2px;color:'+p.accent+';opacity:0.7;text-transform:uppercase;">'+p.subtitle+'</div>'
    + '</div>'

    // Share card
    + shareCard

    // Copy CTA
    + '<div style="text-align:center;margin:24px 0 40px;display:flex;gap:12px;justify-content:center;">'
    + '<button class="ts-cta" data-action="copy">'+copyLabel+'</button>'
    + '<button class="ts-ghost" data-action="restart">Retake</button>'
    + '</div>'

    // Description
    + '<div class="ts-card" style="border:1px solid '+p.color+'33;margin-bottom:22px;">'
    + '<div class="ts-card-label" style="color:'+p.accent+';">Your Profile</div>'
    + '<p style="font-size:16px;line-height:1.75;color:#333;">'+p.description+'</p>'
    + '</div>'

    // Traits
    + '<div style="text-align:center;margin-bottom:22px;">'+traits+'</div>'

    // Character + Vault
    + '<div class="ts-grid-2" style="margin-bottom:22px;">'
    + '<div class="ts-card" style="border:1px solid '+p.color+'33;margin-bottom:0;">'
    + '<div class="ts-card-label" style="color:'+p.accent+';">You Are</div>'
    + '<p style="font-size:13px;line-height:1.6;color:#444;">'+p.character+'</p>'
    + '</div>'
    + '<div class="ts-card" style="border:1px solid '+p.color+'33;margin-bottom:0;">'
    + '<div class="ts-card-label" style="color:'+p.accent+';">Your Vault Track</div>'
    + '<p style="font-size:13px;line-height:1.6;color:#444;">'+p.vaultTrack+'</p>'
    + '</div></div>'

    // Lyric echo
    + '<div style="border-left:4px solid '+p.color+';padding-left:20px;margin-bottom:36px;">'
    + '<div style="font-family:\'DM Mono\',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:'+p.accent+';opacity:0.6;margin-bottom:8px;">Lyric Echo</div>'
    + '<div style="font-family:\'Playfair Display\',serif;font-style:italic;font-size:18px;color:'+p.accent+';line-height:1.5;">'+p.lyricEcho+'</div>'
    + '</div>'

    // Secondary
    + secBlock

    // Score breakdown
    + '<div class="ts-card" style="border:1px solid #E8E2D8;margin-bottom:28px;">'
    + '<div class="ts-card-label">Your Full Archetype Breakdown</div>'
    + bars
    + '</div>'

    // Other archetypes
    + '<div style="margin-bottom:36px;">'
    + '<div style="font-family:\'DM Mono\',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#BBB;margin-bottom:14px;text-align:center;">The Other Five</div>'
    + '<div class="ts-grid-3">'+others+'</div>'
    + '</div>'

    // Bottom CTAs
    + '<div style="text-align:center;display:flex;gap:12px;justify-content:center;">'
    + '<button class="ts-cta" data-action="restart">Retake the Test</button>'
    + '<button class="ts-ghost" data-action="copy">'+copyLabel+'</button>'
    + '</div>'

    + '</div></div>';
}

// ── ANIMATE BARS ──────────────────────────────────────────────────────────
function animateBars() {
  document.querySelectorAll('.ts-bar-fill').forEach(function(el){
    var pct = el.getAttribute('data-pct');
    setTimeout(function(){ el.style.width = pct + '%'; }, 80);
  });
}

// ── EVENTS ────────────────────────────────────────────────────────────────
function bindEvents() {
  document.querySelectorAll('[data-action]').forEach(function(el){
    el.addEventListener('click', function(){
      var action = el.getAttribute('data-action');
      var idx    = el.getAttribute('data-index');
      if (action === 'start')   handleStart();
      if (action === 'answer')  handleAnswer(parseInt(idx, 10));
      if (action === 'restart') handleRestart();
      if (action === 'copy')    handleCopy();
    });
  });
}

function handleStart() {
  state.screen = 'test';
  state.current = 0;
  state.answers = [];
  state.visible = true;
  render();
}

function handleAnswer(idx) {
  if (state.selected !== null) return;
  state.selected = idx;
  render();

  var opt = QUESTIONS[state.current].options[idx];

  setTimeout(function(){
    state.answers.push(opt);
    state.selected = null;
    state.visible = false;
    render();

    setTimeout(function(){
      if (state.current + 1 < QUESTIONS.length) {
        state.current++;
        state.visible = true;
        render();
      } else {
        var s = calcScores(state.answers);
        var ids = topTwo(s);
        state.scores = s;
        state.primary = getPersona(ids[0]);
        state.secondary = getPersona(ids[1]);
        state.screen = 'result';
        state.visible = true;
        render();
        window.scrollTo({ top: document.getElementById('ts-quiz-root').offsetTop - 20, behavior: 'smooth' });
      }
    }, 320);
  }, 380);
}

function handleRestart() {
  state.screen = 'intro';
  state.current = 0;
  state.answers = [];
  state.scores = {};
  state.primary = null;
  state.secondary = null;
  state.selected = null;
  state.visible = true;
  state.copied = false;
  render();
}

function handleCopy() {
  if (!state.primary) return;
  var p = state.primary;
  var sec = state.secondary;
  var text = 'My Taylor Swift archetype: ' + p.emoji + ' ' + p.name + ' (' + p.subtitle + ')\n\n'
    + p.lyricEcho + '\n\n' + p.fandomMirror
    + (sec ? '\n\nTraces of: ' + sec.emoji + ' ' + sec.name : '');
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(function(){
      state.copied = true;
      render();
      setTimeout(function(){ state.copied = false; render(); }, 2500);
    });
  }
}

// ── INIT ──────────────────────────────────────────────────────────────────
render();

})();
</script>
</body>
</html>
